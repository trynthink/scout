[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]

[project]
name = "scout"
readme = "README.md"
dynamic = ["version"]
authors = [
  {email = "chioke.harris@nrel.gov"},
  {name = "Chioke Harris"},
  {email = "jared.langevin@lbl.gov"},
  {name = "Jared Langevin"}
]
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
dependencies = [
    "pandas >= 2.0",
    "numpy >= 1.16, <2.0",
    "scipy",
    "requests",
    "numpy-financial",
    "xlsxwriter",
    "matplotlib",
    "backoff",
    "python-dotenv",
    "pyyaml",
    "jsonschema",
    "pytest",
    "orjson",
    "boto3",
    "pyarrow"
]

[tool.setuptools_scm]

[project.optional-dependencies]
dev = [
    "openpyxl",
    "ruff >= 0.14",
    "pre-commit >= 4.0",
    "tabulate",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/conf.py"]

[tool.ruff.format]
# Match the double-quote convention already used throughout the codebase
quote-style = "double"
